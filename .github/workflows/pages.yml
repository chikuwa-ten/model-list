name: Redirect GitHub Pages to the new site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Make redirect pages
        run: |
          mkdir redirect
          cat > redirect/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>Model List</title>
          <meta name="robots" content="noindex">
          <link rel="canonical" href="https://bb-list.pages.dev/">
          <meta http-equiv="refresh" content="0; url=https://bb-list.pages.dev/">
          <script>
            var p = location.pathname.replace(/^\/model-list\/?/, "");
            location.replace("https://bb-list.pages.dev/" + p + location.search + location.hash);
          </script>
          </head>
          <body><a href="https://bb-list.pages.dev/">Model List has moved.</a></body>
          </html>
          EOF
          cp redirect/index.html redirect/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - id: deployment
        uses: actions/deploy-pages@v4
